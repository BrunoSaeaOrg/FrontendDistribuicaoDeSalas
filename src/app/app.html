@if (isAuthRoute()) {
  <router-outlet />
  <app-toast-stack />
} @else if (breakpoint.isMobile()) {
  <div class="saea-shell saea-shell--mobile">
    <app-mobile-nav
      [items]="navItems"
      [activeRoute]="activeRoute()"
      [currentLabel]="currentBreadcrumbLabel()"
      (itemClick)="onItemClick($event)"
      (signOut)="onSignOut()"
    />

    <main class="saea-main saea-main--mobile">
      <router-outlet />
    </main>
  </div>
} @else {
  <div class="saea-shell">
    <app-header />

    <div class="saea-body">
      <div class="saea-side-wrap">
        <app-side-panel
          [items]="navItems"
          [collapsed]="navCollapsed()"
          [activeRoute]="activeRoute()"
          (toggle)="navCollapsed.set(!navCollapsed())"
          (itemClick)="onItemClick($event)"
          (signOut)="onSignOut()"
        />
      </div>

      <main class="saea-main">
        <!-- <div class="saea-main-top">
          <app-breadcrumb [items]="breadcrumbItems()" />
        </div> -->

        <router-outlet />
      </main>
    </div>

    <app-footer />
    <app-toast-stack />
  </div>
}
